services:
  app:
    build: .
    container_name: aileron-app
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - aileron

  caddy:
    image: caddy:2
    container_name: aileron-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - aileron

volumes:
  caddy_data:
  caddy_config:

networks:
  aileron:
    driver: bridge
