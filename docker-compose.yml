services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - '127.0.0.1:7474:7474' # HTTP (Browser, local/VPS only)
      - '127.0.0.1:7687:7687' # Bolt (Driver, local/VPS only)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'cypher-shell',
          '-u',
          'neo4j',
          '-p',
          '${NEO4J_PASSWORD:-password123}',
          'MATCH () RETURN count(*) limit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aileron

  app:
    build: .
    container_name: aileron-app
    environment:
      - NODE_ENV=production
    env_file:
      - .env.docker
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aileron

  caddy:
    image: caddy:2
    container_name: aileron-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - aileron

volumes:
  neo4j_data:
  neo4j_logs:
  caddy_data:
  caddy_config:

networks:
  aileron:
    driver: bridge
